# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: All Package Benchmarks
on:
  # Trigger on push to specific branches or all branches
  push:
    paths:
      - 'go.mod'
      - '**/*.go'

      - 'go.work'
      - 'go.mod'
      - '.github/workflows/*'

  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - '.github/workflows/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go 1.27
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Normal Benchmark
      run: go test -timeout="4s" -benchmem -run=^$ -benchtime=5s -count 5 -bench "^*$" -v ./...

    - name: Batches Build Tag Benchmark
      run: go test -timeout="4s" -benchmem -run=^$ -tags="batches" -benchtime=5s -count 5 -bench "^BenchmarkSignalsAsync$" -v ./...
